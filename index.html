<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=devce-width, initial-scale=1.0">
        <tittle>Quiz App</tittle>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="quiz-container">
            <header>
                <h1>Quick Quiz</h1>
                <p>Test your knowledge!</p>
            </header>
            <section id="quiz-screen">
                <div class="quiz-info">
                    <span id="question-number">Question 1 of 10</span>
                    <span id="score">Score: 0</span>
                </div>

                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>         

                <h2 id="question">Question appers here</h2>

                <div id="answers" class="answers"></div>
                <p id="feedback" aria-live="polite"></p>

                <button id="next-btn" disabled>Next Question</button>

              </section>
              <section id="result-screen" hidden>
                <h2>Quiz Completed!</h2>
                <p id="final-score"></p>
                <p id="result-message"></p>
                <button id="restart-btn">Play Again</button>
              </section>
        </main>
    </body>
</html>
